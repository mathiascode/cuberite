name: Build
on: [push, pull_request, workflow_dispatch]
permissions: {}

jobs:
  source:
    timeout-minutes: 60
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Build
      run: |
        tar -cvzf cuberite-source.tar.gz *
        sha1sum cuberite-source.tar.gz > cuberite-source.tar.gz.sha1

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: cuberite-source.tar.gz
        archive: false

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: cuberite-source.tar.gz.sha1
        archive: false

  build:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Build
      run: |
        ./nightlybuild.sh -s GitHub -t ${{ matrix.target }} -b ${{ github.ref_name }} -c ${{ matrix.c_compiler }} -cxx ${{ matrix.cpp_compiler }} -m ${{ matrix.build_type }} -n ${{ github.run_number }}

        mv Cuberite.tar.gz cuberite-${{ matrix.target }}.tar.gz
        mv Cuberite.tar.gz.sha1 cuberite-${{ matrix.target }}.tar.gz.sha1

    - name: Upload artifact
      if: matrix.build_type == 'Release' && matrix.c_compiler == 'gcc'
      uses: actions/upload-artifact@v7
      with:
        path: cuberite-${{ matrix.target }}.tar.gz
        archive: false

    - name: Upload artifact
      if: matrix.build_type == 'Release' && matrix.c_compiler == 'gcc'
      uses: actions/upload-artifact@v7
      with:
        path: cuberite-${{ matrix.target }}.tar.gz.sha1
        archive: false

  build-windows:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [windows-x86_64, windows-arm64]
        build_type: [Release, Debug]
        include:
          - target: windows-x86_64
            os: windows-2025
          - target: windows-arm64
            os: windows-11-arm

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSELF_TEST=Yes -DBUILD_TOOLS=Yes
        cmake --build build --config ${{ matrix.build_type }}
        cd build\Server
        Install\PackWindowsExecutables.cmd
        mv Cuberite.zip cuberite-${{ matrix.target }}.zip
        mv PDBs.zip cuberite-pdbs.zip
        mv AutoAPI.zip cuberite-autoapi.zip
        mv ManualAPI.zip cuberite-manualapi.zip

    - name: Upload artifact
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        path: build\Server\cuberite-${{ matrix.target }}.zip
        archive: false

    - name: Upload artifact
      if: matrix.target == 'windows-x86_64' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        path: build\Server\cuberite-pdbs.zip
        archive: false

    - name: Upload artifact
      if: matrix.target == 'windows-x86_64' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        path: build\Server\cuberite-autoapi.zip
        archive: false

    - name: Upload artifact
      if: matrix.target == 'windows-x86_64' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        path: build\Server\cuberite-manualapi.zip
        archive: false

    - name: Upload artifact
      if: matrix.target == 'windows-x86_64' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        path: build\Server\.luacheckrc
        archive: false
        include-hidden-files: true

  build-android:
    timeout-minutes: 60
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: sudo apt install lua5.1

    - name: Build
      run: |
        CMAKE=$ANDROID_SDK_ROOT/cmake/3.18.1/bin/cmake NDK=$ANDROID_NDK android/compile.sh all

        mv android/Server/server.zip android/Server/cuberite-android-server.zip
        mv android/Server/server.zip.sha1 android/Server/cuberite-android-server.zip.sha1
        mv android/Server/armeabi-v7a.zip android/Server/cuberite-android-armeabi-v7a.zip
        mv android/Server/armeabi-v7a.zip.sha1 android/Server/cuberite-android-armeabi-v7a.zip.sha1
        mv android/Server/arm64-v8a.zip android/Server/cuberite-android-arm64-v8a.zip
        mv android/Server/arm64-v8a.zip.sha1 android/Server/cuberite-android-arm64-v8a.zip.sha1
        mv android/Server/x86.zip android/Server/cuberite-android-x86.zip
        mv android/Server/x86.zip.sha1 android/Server/cuberite-android-x86.zip.sha1
        mv android/Server/x86_64.zip android/Server/cuberite-android-x86_64.zip
        mv android/Server/x86_64.zip.sha1 android/Server/cuberite-android-x86_64.zip.sha1

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-server.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-server.zip.sha1
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-armeabi-v7a.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-armeabi-v7a.zip.sha1
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-arm64-v8a.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-arm64-v8a.zip.sha1
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-x86.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-x86.zip.sha1
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-x86_64.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android/Server/cuberite-android-x86_64.zip.sha1
        archive: false

  upload_release:
    # Disable the job until a proper release process is made
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/experimental') && false
    permissions:
      contents: write
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automatically uploaded release by GitHub actions
          fail_on_unmatched_files: true
          files: |
                  ${{ github.workspace }}/Cuberite-ubuntu-latest-clang-Release.zip
                  ${{ github.workspace }}/Cuberite-ubuntu-latest-gcc-Release.zip
          prerelease: true
      # Taken from here https://stackoverflow.com/questions/68895194/github-actions-create-or-update-a-git-tag
      - if: ${{ success() }}
        name: Fix tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/release-${{ github.ref_name }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/release-${{ github.ref_name }}',
                sha: context.sha
              });
            })

