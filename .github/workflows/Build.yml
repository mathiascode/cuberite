name: Build
on:
  push:
    tags-ignore:
      - release-*
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-posix:
    timeout-minutes: 60
    permissions: {}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Build
      run: |
        ./nightlybuild.sh -s GitHub -t ${{ matrix.os }} -b ${{ github.ref_name }} -c ${{ matrix.c_compiler }} -cxx ${{ matrix.cpp_compiler }} -m ${{ matrix.build_type }} -n ${{ github.run_number }}
        mv Cuberite.tar.gz Cuberite-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.tar.gz
        mv Cuberite.tar.gz.sha1 Cuberite-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.tar.gz.sha1

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: Cuberite-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.tar.gz
        archive: false

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: Cuberite-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.tar.gz.sha1
        archive: false

  build-android:
    timeout-minutes: 60
    permissions: {}
    runs-on: ubuntu-22.04
    env:
      CMAKE: $ANDROID_SDK_ROOT/cmake/3.18.1/bin
      NDK: $ANDROID_NDK

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: sudo apt install lua5.1

    - name: Build
      run: |
        cd android/
        CMAKE=$ANDROID_SDK_ROOT/cmake/3.18.1/bin/cmake NDK=$ANDROID_NDK ./compile.sh all
        mv Server/server.zip Server/android-server.zip
        mv armeabi-v7a.zip android-armeabi-v7a.zip
        mv arm64-v8a.zip android-arm64-v8a.zip
        mv x86.zip android-x86.zip
        mv x86_64.zip android-x86_64.zip

    - uses: actions/upload-artifact@v7
      with:
        path: Server/android-server.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android-armeabi-v7a.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android-arm64-v8a.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android-x86.zip
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        path: android-x86_64.zip
        archive: false

  upload_release:
    # Disable the job until a proper release process is made
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/experimental') && false
    permissions:
      contents: write
    needs: build-posix
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automatically uploaded release by GitHub actions
          fail_on_unmatched_files: true
          files: |
                  ${{ github.workspace }}/Cuberite-ubuntu-latest-clang-Release.zip
                  ${{ github.workspace }}/Cuberite-ubuntu-latest-gcc-Release.zip
          prerelease: true
      # Taken from here https://stackoverflow.com/questions/68895194/github-actions-create-or-update-a-git-tag
      - if: ${{ success() }}
        name: Fix tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/release-${{ github.ref_name }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/release-${{ github.ref_name }}',
                sha: context.sha
              });
            })

